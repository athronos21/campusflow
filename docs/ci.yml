name: CampusFlow Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Contracts Package
        run: pnpm --filter @campusflow/contracts build

      - name: Build NestJS API
        run: pnpm --filter @campusflow/api build

      - name: Build Next.js Web Application
        run: pnpm --filter @campusflow/web build

  flutter-validate:
    name: Validate Flutter Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Flutter codebase
        run: |
          cd apps/mobile
          flutter analyze
