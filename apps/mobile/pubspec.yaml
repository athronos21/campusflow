name: campusflow_mobile
description: "CampusFlow Student Super-App for Haramaya University & Ethiopian Higher Education"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP & REST Client
  dio: ^5.4.3+1
  # Local Storage & Caching
  shared_preferences: ^2.2.3
  # UI & Icons
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
