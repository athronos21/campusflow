name: CampusFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-web:
    name: Backend, Web & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow_dev_password
          POSTGRES_DB: campusflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Push DB Schema
        env:
          DATABASE_URL: "postgresql://campusflow:campusflow_dev_password@localhost:5432/campusflow_db?schema=public"
        run: |
          pnpm db:generate
          pnpm db:push
          pnpm db:seed

      - name: Run End-to-End Test Suite
        env:
          DATABASE_URL: "postgresql://campusflow:campusflow_dev_password@localhost:5432/campusflow_db?schema=public"
        run: pnpm test:e2e

      - name: Build Contracts Package
        run: pnpm --filter @campusflow/contracts build

      - name: Build NestJS API
        run: pnpm --filter @campusflow/api build

      - name: Build Next.js Web App
        run: pnpm --filter @campusflow/web build

  mobile:
    name: Flutter Mobile Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Unit Tests
        run: flutter test
