version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-postgres
    restart: always
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow_dev_password
      POSTGRES_DB: campusflow_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
